limit_req_zone $binary_remote_addr zone=support_requests:10m rate=5r/s;
map $uri $crm_log_path {
    ~^/api/support/request/ /api/support/request/[redacted];
    ~^/api/support/session/ /api/support/session/[redacted];
    default $uri;
}
log_format crm '$request_id $request_method $crm_log_path $status $request_time';

server {
    listen 8080;
    server_name dev-hellow.shnea.kr localhost;
    server_tokens off;
    client_max_body_size 1M;
    access_log /var/log/nginx/access.log crm;
    add_header X-Request-ID $request_id always;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Backend API Routing
    location /api/support/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        limit_req zone=support_requests burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/editor/files {
        client_max_body_size 1024M;
        proxy_request_buffering off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_buffering off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # LiveKit WebRTC Signaling & WebSocket Routing
    location /livekit/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend UI Routing
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
