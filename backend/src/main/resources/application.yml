server:
  port: 8080

spring:
  application:
    name: hellow-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hellow}
    username: ${DB_USER:hellow}
    password: ${DB_PASSWORD:hellow_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

platform:
  api-url: ${PLATFORM_API_URL:https://platform.shnea.kr}
  api-key: ${PLATFORM_API_KEY:}
  project-id: ${PLATFORM_PROJECT_ID:}
  environment-id: ${PLATFORM_ENVIRONMENT_ID:}
  oidc-issuer: ${PLATFORM_OIDC_ISSUER:}
  oidc-client-id: ${PLATFORM_OIDC_CLIENT_ID:app}
  oidc-redirect-uri: ${PLATFORM_OIDC_REDIRECT_URI:https://dev-hellow.shnea.kr/auth/callback}
  post-logout-redirect-uri: ${OIDC_POST_LOGOUT_REDIRECT_URI:https://dev-hellow.shnea.kr/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
