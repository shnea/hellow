server:
  port: 8080

spring:
  application:
    name: hellow-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hellow}
    username: ${DB_USER:hellow}
    password: ${DB_PASSWORD:hellow_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
