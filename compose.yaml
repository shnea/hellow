name: hellow-dev

services:
  db:
    image: postgres:17.11-alpine
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: hellow
      POSTGRES_USER: hellow
      POSTGRES_PASSWORD: hellow_dev_password
    ports:
      - "30161:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: hellow-dev-api:${HELLOW_DEV_IMAGE_TAG:-latest}
    build:
      context: .
      target: api
    env_file:
      - .env.dev
    environment:
      TZ: Asia/Seoul
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hellow
      DB_USER: hellow
      DB_PASSWORD: hellow_dev_password
      HELLOW_RECORDING_ENABLED: ${HELLOW_RECORDING_ENABLED:-true}
    volumes:
      - recordings:/recordings
    group_add: ["2000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  web:
    image: hellow-dev-web:${HELLOW_DEV_IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    env_file:
      - .env.dev
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    environment:
      TZ: Asia/Seoul
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./infra/livekit/development.yaml:/etc/livekit.yaml:ro
    ports:
      - "30162:7880"
      # Router WAN 30163 -> host 7881 -> container/advertised ICE 30163.
      - "7881:30163"
      - "7882:30164/udp"
      - "3478:30167/udp"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - media-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  recording-storage:
    image: alpine:3.21
    command: ["sh", "-c", "mkdir -p /recordings && chown root:2000 /recordings && chmod 2770 /recordings"]
    volumes:
      - recordings:/recordings

  egress:
    image: livekit/egress:v1.14.1
    group_add: ["2000"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      EGRESS_CONFIG_BODY: |
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
    volumes:
      - recordings:/recordings
    depends_on:
      recording-storage:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    environment:
      TZ: Asia/Seoul
    ports:
      - "30160:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db-data:
  recordings:
  media-redis:
